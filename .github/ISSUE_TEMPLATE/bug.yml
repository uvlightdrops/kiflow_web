name: Fehlerbericht
description: Einen Fehler nachvollziehbar beschreiben
title: "[Fehler] "
body:
  - type: input
    id: location
    attributes:
      label: Betroffene Seite oder Projektversion
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Schritte zum Reproduzieren
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes und tatsächliches Verhalten
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Umgebung und bereinigte Fehlermeldung
      description: Keine Tokens, Zugangsdaten oder personenbezogenen Daten einfügen.
